<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Europa 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page-bg" id="page-bg"></div>

<header class="hero">
  <div class="hero-collage" id="hero-collage"></div>
  <div class="hero-overlay"></div>
  <div class="hero-inner">
    <p class="eyebrow">Viaje del grupo</p>
    <h1 id="trip-name">Europa 2026</h1>
    <p class="subtitle" id="trip-subtitle">París · Bruselas · Ámsterdam</p>
    <div class="travelers" id="travelers"></div>
    <div class="countdown" id="countdown"></div>
  </div>
</header>

<nav class="pill-nav" id="pill-nav"></nav>

<main id="app"></main>

<footer>
  <p>Hecho a mano para el viaje · actualiza <code>data/trip.js</code> para editar el itinerario.</p>
  <p class="credits" id="photo-credits"></p>
</footer>

<script src="data/trip.js"></script>
<!-- Archivo local opcional (no está en git) con teléfonos/números de reserva reales -->
<script src="data/trip.private.js" onerror="console.info('data/trip.private.js no existe — se muestran solo los datos públicos.')"></script>
<script src="js/app.js"></script>
</body>
</html>
